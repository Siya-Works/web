name: Build and deploy Siya Works
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}
      NEXT_PUBLIC_ADS_ENABLED: ${{ vars.ADS_ENABLED || 'false' }}
      NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
      NEXT_PUBLIC_ADSENSE_SLOT_ID: ${{ vars.ADSENSE_SLOT_ID }}
      NEXT_PUBLIC_ADS_CONSENT_READY: ${{ vars.ADS_CONSENT_READY || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read GitHub Pages URL
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Configure public URLs
        env:
          PAGES_BASE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          printf 'NEXT_PUBLIC_SITE_URL=%s\nNEXT_PUBLIC_BASE_PATH=%s\n' "${PAGES_BASE_URL:-https://siyaworks.in}" "$PAGES_BASE_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run verify:export
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
